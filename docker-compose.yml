services:
  compact-lab:
    build: .
    container_name: cc-compact-lab-compact-bug-15
    ports:
      - "7415:7300"
    environment:
      HOST: "0.0.0.0"
      PORT: "7300"
      DATABASE_PATH: /app/instance/compact_lab.db
    volumes:
      - compact_lab_data:/app/instance
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7300/login', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  compact_lab_data:
