<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 · 湖表压实台</title>
  <link rel="stylesheet" href="/static/css/compact.css" />
</head>
<body class="login-body">
  <form id="form" class="login-card">
    <p class="brand">湖表压实台</p>
    <h1>登录</h1>
    <label>账号<input name="username" value="admin" autocomplete="username" /></label>
    <label>密码<input name="password" type="password" value="123456" autocomplete="current-password" /></label>
    <button type="submit">进入控制台</button>
    <p id="msg" class="muted"></p>
  </form>
  <script>
    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const body = { username: fd.get('username'), password: fd.get('password') };
      const r = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
      const j = await r.json().catch(()=>({}));
      if (!r.ok) { document.getElementById('msg').textContent = j.error || '登录失败'; return; }
      location.href = '/app/';
    };
  </script>
</body>
</html>
